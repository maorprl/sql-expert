<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Lab</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div><h1>SQL Lab <span class="stage-label">Stage 1</span></h1><span id="db-status" class="status">Loading database…</span></div>
        <div class="actions"><button id="run-query" class="primary lab-action" hidden disabled>Run query <kbd>Ctrl / ⌘ + Enter</kbd></button><button id="clear-results" class="lab-action" hidden disabled>Clear results</button><button id="reset-db" disabled>Reset database</button></div>
      </header>
      <section id="error-panel" class="message error" hidden></section>
      <section class="workspace">
        <aside class="schema-panel">
          <div class="panel-header"><h2>Schema</h2><input id="schema-search" type="search" placeholder="Find relations or columns" aria-label="Search schema" /></div>
          <div id="schema-viewer" class="schema-viewer" aria-live="polite"></div>
        </aside>
        <section class="learning-panel">
          <div id="stage-scroll" class="stage-scroll">
            <section class="business-request" aria-labelledby="business-request-title">
              <span class="eyebrow">Research request</span>
              <h2 id="business-request-title">The research team is reviewing media coverage and wants every article to include the source that published it.</h2>
            </section>
            <section class="working-schema-header"><span class="eyebrow">Working schema</span><span>Selected relations</span></section>
            <section id="relation-preview" class="relation-preview" aria-label="Working schema"></section>
            <section id="completed-steps" class="completed-steps" aria-label="Completed reasoning"></section>
            <section id="current-step" class="current-step" aria-live="polite"></section>
          </div>
          <section id="lab-workspace" class="lab-workspace" hidden>
            <div class="editor-header"><h2>Query</h2></div>
            <div id="editor" aria-label="SQL editor"></div>
            <section class="results-panel">
              <div class="results-header"><h2>Results</h2><span id="result-meta">No query run</span></div>
              <div id="result-content" class="result-content"><p class="empty">Results will appear here.</p></div>
            </section>
          </section>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
